version: "3.9"

# ════════════════════════════════════════════════════
#  News Big Data Platform — Docker Compose
#  Services: MinIO · Kafka · Zookeeper · Spark · Airflow · PostgreSQL
# ════════════════════════════════════════════════════

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "d6Fz_CXGl4y2qPq5s7N5E8sMFHQNFj9GGFT-0m4l0kA="
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "news-platform-secret-2025"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_URL: jdbc:postgresql://postgres:5432/newsdb
    POSTGRES_USER: newsuser
    POSTGRES_PASSWORD: newspass
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scrapers:/opt/airflow/scrapers
    - ./medallion:/opt/airflow/medallion
    - ./quality:/opt/airflow/quality
    - ./governance:/opt/airflow/governance
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ──────────────────────────────────────────────
  # PostgreSQL — Airflow metadata + Data Warehouse
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: news-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MinIO — Data Lake (Bronze / Silver / Gold)
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: news-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Initialisation des buckets MinIO
  minio-init:
    image: minio/mc:latest
    container_name: news-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/gold;
        echo 'Buckets created: bronze, silver, gold';
        exit 0;
      "

  # ──────────────────────────────────────────────
  # Zookeeper + Kafka — Streaming
  # ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: news-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: news-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168        # 7 jours
      KAFKA_LOG_SEGMENT_BYTES: 1073741824   # 1 GB
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"   # Accès externe (localhost)
    restart: unless-stopped

  # Création du topic Kafka
  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: news-kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
        sleep 10;
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092
          --replication-factor 1 --partitions 3 --topic news.raw;
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092
          --replication-factor 1 --partitions 1 --topic news.quality.alerts;
        echo 'Topics created';
        exit 0;
      "

  # ──────────────────────────────────────────────
  # Apache Spark
  # ──────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: news-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "8081:8080"   # Spark UI
      - "7077:7077"   # Spark master port
    volumes:
      - ./medallion:/opt/spark/medallion
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.0
    container_name: news-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Apache Airflow
  # ──────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: news-airflow-init
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@emsi.ma --password admin123"
    restart: on-failure
  

  airflow-webserver:
    <<: *airflow-common
    container_name: news-airflow-webserver
    command: webserver
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: news-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Metabase — Dashboard & Visualisation
  # ──────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: news-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes persistants
# ──────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:
  kafka-data:
  zookeeper-data:
  airflow-logs:

# ──────────────────────────────────────────────
# Réseau interne
# ──────────────────────────────────────────────
networks:
  default:
    name: news-platform-network
    driver: bridge
